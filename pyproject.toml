[project]
name = "pagepal"
version = "0.1.0"
description = "On-call incident agent: alert -> investigate -> propose fix -> human approval -> act"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pagepal = "pagepal.run:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.40",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
